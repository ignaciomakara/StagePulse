<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="audienceTitle">StagePulse · Audience</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="module" src="/static/audience.js"></script>
  </head>
  <body>
    <main class="audience">
      <header><h1 id="stage-title">StagePulse</h1></header>
      <label><span data-i18n="uiLanguage">UI language</span><select id="ui-language"><option value="en">English</option><option value="es">Español</option></select></label>
      <label><span data-i18n="captionLanguage">Caption language</span><select id="language"><option value="en" data-i18n="original">Original</option><option value="es" data-i18n="spanish">Español</option></select></label>
      <button id="fullscreen" type="button" data-i18n="fullscreen">Fullscreen</button>
      <p id="connection" role="status">Connecting…</p>
      <div id="captions" class="captions audience-captions" aria-live="polite"></div>
    </main>
  </body>
</html>
