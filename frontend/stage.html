<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="stageTitle">StagePulse · Stage Console</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="module" src="/static/stage.js"></script>
  </head>
  <body>
    <main>
      <header><h1 data-i18n="stageTitle">StagePulse · Stage Console</h1><p data-i18n="stageSubtitle">Live stage audio and captions</p></header>
      <section class="controls">
        <label><span data-i18n="uiLanguage">UI language</span><select id="ui-language"><option value="en">English</option><option value="es">Español</option></select></label>
        <label><span data-i18n="stage">Stage</span><select id="stage"></select></label>
        <label><span data-i18n="audioInput">Audio input</span><select id="device"></select></label>
        <button id="devices" type="button" data-i18n="enableDevices">Enable audio devices</button>
        <button id="start" type="button" data-i18n="start">Start</button>
        <button id="stop" type="button" data-i18n="stop" disabled>Stop</button>
        <a id="audience-link" target="_blank" rel="noopener" data-i18n="openAudience">Open Audience View</a>
        <a href="/control" target="_blank" rel="noopener" data-i18n="openControl">Open Control Room</a>
      </section>
      <section class="audience-share" aria-label="Audience link">
        <h2 data-i18n="audienceQr">Audience QR</h2>
        <img id="audience-qr" alt="Audience View QR code" data-i18n-alt="audienceQrAlt" width="180" height="180">
        <label><span data-i18n="audienceUrl">Audience URL</span><input id="audience-url" type="url" readonly></label>
        <button id="copy-audience-url" type="button" data-i18n="copyAudience">Copy audience link</button>
        <p id="audience-warning" role="status"></p>
      </section>
      <p id="connection" role="status">Idle</p>
      <p id="stage-status">Stage status: created</p>
      <section class="caption-grid">
        <article><h2 data-i18n="originalEnglish">Original · English</h2><div id="original" class="captions" aria-live="polite"></div></article>
        <article><h2 data-i18n="spanish">Español</h2><div id="translated" class="captions" aria-live="polite"></div></article>
      </section>
    </main>
  </body>
</html>
